name: Publish preview update

on:
  push:
    branches: ['*']

jobs:
  publish_preview_update:
    name: Publish preview update
    type: update
    environment: preview
    params:
      platform: all
      branch: ${{ github.ref_name }}
      message: ${{ github.event.head_commit.message || github.ref_name }}

concurrency:
  cancel_in_progress: true
  group: ${{ workflow.filename }}-${{ github.ref }}
